# Publishes the portal to GitHub Pages on every change to main.
# Before publishing it stamps every ?v= on scripts and styles in the HTML with this change's commit ID,
# so browsers always load the newest code (no more forgetting to bump version numbers by hand).
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Copy the site and stamp file versions
        run: |
          V="${GITHUB_SHA::8}"
          mkdir _site
          git ls-files -z | grep -zv '^\.github/' | xargs -0 cp --parents -t _site
          for f in _site/*.html; do sed -i -E "s/\.(js|css)\?v=[0-9A-Za-z]+/.\1?v=${V}/g" "$f"; done
          echo "Stamped version ${V}:"; grep -ho '[a-z/-]*\.\(js\|css\)?v=[0-9A-Za-z]*' _site/*.html | sort -u
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true
      # GitHub sometimes has a brief hiccup here ("Fetching artifact metadata failed"); wait and try again before failing
      - id: deploy1
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 45
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 90
      - id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5
